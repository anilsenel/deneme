<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KT Akademi · Program Planlayıcı</title>
<style>
/* ============================================================
   TASARIM SİSTEMİ
   ============================================================ */
:root{
  --brand:#12314f; --brand-2:#1c4a76; --accent:#c5a059; --accent-2:#e0c188;

  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#eef2f7;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --text-soft:#475569; --muted:#7c8aa0;

  --primary:#1c4a76; --primary-hover:#12314f; --primary-soft:#e8f0f8;
  --success:#059669; --success-soft:#ecfdf5;
  --warning:#d97706; --warning-soft:#fffbeb;
  --danger:#e11d48;  --danger-soft:#fff1f2;
  --info:#0284c7;    --info-soft:#f0f9ff;

  --radius-sm:8px; --radius:12px; --radius-lg:16px; --radius-xl:22px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 4px 16px -6px rgba(15,23,42,.16);
  --shadow-lg:0 18px 40px -18px rgba(15,23,42,.35);
  --ring:0 0 0 3px rgba(28,74,118,.20);

  --pool-w:290px;
  --day-w:200px;
  --block-h:170px;
  --font:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
}
html[data-theme="dark"]{
  --brand:#0b1a2b; --brand-2:#12314f; --accent:#d4af6a; --accent-2:#e8cd97;
  --bg:#070b14; --surface:#111827; --surface-2:#161f2f; --surface-3:#1e293b;
  --border:#253044; --border-strong:#35435c;
  --text:#e8edf7; --text-soft:#b6c2d6; --muted:#8b98ad;
  --primary:#7dabd6; --primary-hover:#a8c8e6; --primary-soft:#16283c;
  --success:#34d399; --success-soft:#0d2b23;
  --warning:#fbbf24; --warning-soft:#2d2410;
  --danger:#fb7185;  --danger-soft:#331520;
  --info:#38bdf8;    --info-soft:#0c2537;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 6px 18px -8px rgba(0,0,0,.7);
  --shadow-lg:0 24px 48px -20px rgba(0,0,0,.8);
  --ring:0 0 0 3px rgba(125,171,214,.28);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--primary);color:#fff}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--primary)}
.scroll::-webkit-scrollbar,.board::-webkit-scrollbar,.pool-body::-webkit-scrollbar,
.block::-webkit-scrollbar,.modal::-webkit-scrollbar,.drawer-body::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-track,.board::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb,.board::-webkit-scrollbar-thumb,.pool-body::-webkit-scrollbar-thumb,
.block::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb,.drawer-body::-webkit-scrollbar-thumb{
  background:var(--border-strong);border:3px solid transparent;background-clip:content-box;border-radius:99px}

/* ---------- ikon ---------- */
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.ic-lg{width:20px;height:20px}
.ic-sm{width:13px;height:13px}

/* ---------- butonlar ---------- */
button{font-family:inherit;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  font-weight:600;cursor:pointer;transition:.16s;white-space:nowrap;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--surface-3);border-color:var(--muted);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#3a2b0c}
.btn-accent:hover{filter:brightness(1.06);color:#3a2b0c}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-soft)}
.btn-ghost:hover{background:var(--surface-3);border-color:transparent}
.btn-danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn-sm{padding:5px 9px;font-size:12px;gap:5px}
.btn-icon{padding:8px;border-radius:var(--radius-sm)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- form ---------- */
input,select,textarea{
  font-family:inherit;font-size:13px;color:var(--text);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:8px 10px;width:100%;transition:.16s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring)}
textarea{resize:vertical;min-height:80px;line-height:1.55}
label.lbl{display:block;font-size:11.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.field{margin-bottom:14px}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
input[type=color]{padding:2px;height:34px;cursor:pointer}

/* ============================================================
   ÜST BAR
   ============================================================ */
header{
  background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;flex:none;
  display:flex;align-items:center;gap:16px;padding:0 16px;height:58px;
  box-shadow:0 1px 0 rgba(0,0,0,.15),0 4px 18px -8px rgba(0,0,0,.45);z-index:60}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand img{height:30px;width:auto;display:block;filter:brightness(0) invert(1);opacity:.96}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.brand-txt span{font-size:10.5px;opacity:.65;letter-spacing:.09em;text-transform:uppercase}
.brand-sep{width:1px;height:28px;background:rgba(255,255,255,.18);flex:none}

.viewnav{display:flex;gap:2px;background:rgba(255,255,255,.10);padding:3px;border-radius:10px}
.viewnav button{display:flex;align-items:center;gap:6px;padding:6px 12px;border:none;border-radius:7px;
  background:transparent;color:rgba(255,255,255,.72);font-weight:600;cursor:pointer;transition:.16s}
.viewnav button:hover{background:rgba(255,255,255,.10);color:#fff}
.viewnav button.on{background:var(--accent);color:#3a2b0c;box-shadow:0 2px 8px -2px rgba(0,0,0,.4)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);color:#fff;font-weight:600;cursor:pointer;transition:.16s;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.17)}
.hbtn.gold{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#3a2b0c}
.hbtn.gold:hover{filter:brightness(1.07)}

/* ---------- program sekmeleri ---------- */
.tabbar{flex:none;display:flex;align-items:center;gap:4px;padding:7px 14px;background:var(--surface-2);
  border-bottom:1px solid var(--border);overflow-x:auto;z-index:40}
.tab{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 13px;border-radius:99px;cursor:pointer;
  font-weight:600;font-size:12.5px;color:var(--text-soft);background:var(--surface-3);
  border:1px solid transparent;user-select:none;transition:.16s;white-space:nowrap}
.tab:hover{background:var(--surface);border-color:var(--border-strong)}
.tab.on{background:var(--surface);border-color:var(--primary);color:var(--text);box-shadow:var(--shadow-sm)}
.tab.on .tab-dot{background:var(--accent)}
.tab-dot{width:7px;height:7px;border-radius:99px;background:var(--border-strong);flex:none}
.tab-x{opacity:.4;padding:2px;border-radius:99px;display:flex}
.tab-x:hover{opacity:1;background:var(--danger-soft);color:var(--danger)}
.tab-add{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1px dashed var(--border-strong);
  background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tab-add:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft)}
.tabbar-right{margin-left:auto;display:flex;gap:6px;align-items:center;padding-left:10px}

/* ---------- araç çubuğu ---------- */
.toolbar{flex:none;display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--surface);
  border-bottom:1px solid var(--border);flex-wrap:wrap;z-index:30}
.tool-group{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px}
.tool-group .lb{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-left:8px}
.tool-group input{width:auto;border:none;background:transparent;box-shadow:none;padding:5px 4px;font-weight:600}
.tool-group input:focus{box-shadow:none}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;
  background:var(--surface-3);color:var(--text-soft);border:1px solid var(--border)}
.chip b{color:var(--text)}

/* ============================================================
   GÖVDE
   ============================================================ */
main{flex:1;overflow:hidden;position:relative;display:flex}
.view{display:none;width:100%;height:100%;overflow:hidden}
.view.on{display:flex}

/* ---------- havuz ---------- */
.pool{width:var(--pool-w);flex:none;background:var(--surface-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column}
.pool-head{padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.pool-head h3{font-size:13px;flex:1;display:flex;align-items:center;gap:7px}
.pool-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.pool-body.drag-over{background:var(--success-soft);outline:2px dashed var(--success);outline-offset:-6px}
.pool-empty{text-align:center;color:var(--muted);font-size:12.5px;padding:34px 14px;line-height:1.7}
.pool-empty svg{width:34px;height:34px;opacity:.35;margin-bottom:10px;stroke-width:1.4}

/* ---------- takvim tahtası ---------- */
.board{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.week{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;min-width:min-content;flex:none}
.week-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--surface-2);
  border-bottom:1px solid var(--border)}
.week-bar h4{font-size:12.5px;color:var(--text-soft);display:flex;align-items:center;gap:7px}
.week-bar .rt{margin-left:auto;display:flex;gap:6px;align-items:center}
.week-grid{display:flex}
.timecol{width:74px;flex:none;background:var(--surface-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding-top:52px}
.tlabel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;font-weight:700;color:var(--text-soft);border-bottom:1px solid var(--border);text-align:center;line-height:1.3}
.tlabel small{font-weight:600;color:var(--muted);font-size:10px}
.tlabel.break{color:var(--muted);font-size:10px}
.days{display:flex}
.daycol{width:var(--day-w);min-width:var(--day-w);border-right:1px solid var(--border);
  display:flex;flex-direction:column;background:var(--surface)}
.daycol:last-child{border-right:none}
.daycol.off{opacity:.5;filter:saturate(.4)}
.dhead{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:#fff;position:relative;border-bottom:2px solid rgba(0,0,0,.12)}
.dhead b{font-size:13px;font-weight:650;letter-spacing:-.01em}
.dhead span{font-size:10.5px;opacity:.85;font-weight:600;letter-spacing:.04em}
.dhead .dh-tools{position:absolute;top:3px;right:4px;display:flex;gap:2px;opacity:0;transition:.15s}
.daycol:hover .dh-tools{opacity:1}
.dh-tools button{background:rgba(0,0,0,.22);border:none;color:#fff;border-radius:5px;padding:3px;cursor:pointer;display:flex}
.dh-tools button:hover{background:rgba(0,0,0,.42)}

.block{padding:5px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;
  border-bottom:1px solid var(--border);transition:background .15s;position:relative}
.block.drag-over{background:var(--success-soft)!important;outline:2px dashed var(--success);outline-offset:-4px}
.block.full{background:var(--danger-soft)}
.block-break{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;
  color:var(--muted);border-bottom:1px solid var(--border);user-select:none;
  background:repeating-linear-gradient(45deg,transparent,transparent 9px,rgba(125,125,125,.07) 9px,rgba(125,125,125,.07) 18px)}
.block-break.fixed{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#3a2b0c;font-weight:700}
.block-break:hover .bb-edit{opacity:.75}
.bb-edit{opacity:0;transition:.15s;cursor:pointer;display:flex}
.dfoot{padding:6px;border-top:1px solid var(--border);background:var(--surface-2);display:flex;gap:4px;align-items:center}
.dfoot input{font-size:11px;padding:5px 7px;text-align:center;font-weight:600;background:var(--surface)}
.loadbar{height:3px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:0 5px 5px}
.loadbar i{display:block;height:100%;background:var(--success);transition:.3s}
.loadbar i.warn{background:var(--warning)} .loadbar i.over{background:var(--danger)}

/* ---------- oturum kartı (ızgara) ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--muted);
  border-radius:var(--radius-sm);padding:6px 8px;cursor:grab;position:relative;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:3px;transition:.14s;min-height:44px}
.card:hover{box-shadow:var(--shadow);border-color:var(--border-strong);transform:translateY(-1px)}
.card:active{cursor:grabbing}
.card.dragging{opacity:.4;transform:rotate(1.5deg)}
.card-t{font-weight:650;font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;padding-right:34px}
.card-m{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:10.5px;color:var(--text-soft);align-items:center}
.card-m span{display:inline-flex;align-items:center;gap:3px;min-width:0}
.card-m span b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:105px}
.card-tools{position:absolute;top:4px;right:4px;display:flex;gap:1px;opacity:0;transition:.15s}
.card:hover .card-tools{opacity:1}
.card-tools button{background:var(--surface-3);border:none;color:var(--text-soft);border-radius:5px;
  padding:3px;cursor:pointer;display:flex}
.card-tools button:hover{background:var(--primary);color:#fff}
.dur-pill{margin-left:auto;background:var(--surface-3);border-radius:99px;padding:1px 7px;font-weight:700;
  font-size:10px;color:var(--text-soft);flex:none}
.card .sugg{margin-top:2px;font-size:10px;background:var(--info-soft);border:1px solid var(--border);
  border-radius:6px;padding:4px 6px;color:var(--text-soft);line-height:1.5}
.card .sugg b{color:var(--info);display:block;margin-bottom:2px;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}
.card .sugg u{text-decoration:none;display:inline-block;background:var(--surface);border:1px solid var(--border);
  border-radius:4px;padding:1px 5px;margin:1px 2px 0 0;cursor:pointer;font-weight:600}
.card .sugg u:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.editable{cursor:text;border-radius:3px;padding:0 2px}
.editable:hover{background:var(--warning-soft);outline:1px dashed var(--warning)}
.inline-in{font-size:11px;padding:2px 4px;border-radius:4px;min-width:60px}

/* ============================================================
   KART GÖRÜNÜMÜ
   ============================================================ */
.pane{flex:1;overflow-y:auto;padding:22px;width:100%}
.pane-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pane-head h2{font-size:20px;display:flex;align-items:center;gap:9px}
.pane-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.pane-head .rt{margin-left:auto;display:flex;gap:8px;align-items:center}

.doc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);max-width:1180px;margin:0 auto;overflow:hidden}
.doc-hero{background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;padding:26px 30px;
  display:flex;align-items:center;gap:20px;position:relative;overflow:hidden}
.doc-hero::after{content:'';position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(197,160,89,.30),transparent 68%)}
.doc-hero img{height:44px;filter:brightness(0) invert(1);flex:none;position:relative;z-index:1}
.doc-hero .dh-sep{width:1px;height:44px;background:rgba(255,255,255,.22);flex:none;z-index:1}
.doc-hero h1{font-size:22px;letter-spacing:-.02em;z-index:1;position:relative}
.doc-hero .sub{font-size:12.5px;opacity:.78;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;z-index:1;position:relative}
.doc-hero .sub span{display:inline-flex;align-items:center;gap:5px}
.doc-body{padding:24px 30px 30px}

.daygroup{margin-bottom:26px}
.daygroup:last-child{margin-bottom:0}
.dg-head{display:flex;align-items:center;gap:11px;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid var(--border)}
.dg-badge{width:46px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:#fff;flex:none;line-height:1.05;box-shadow:var(--shadow-sm)}
.dg-badge b{font-size:17px;font-weight:700}
.dg-badge span{font-size:9px;text-transform:uppercase;letter-spacing:.06em;opacity:.9}
.dg-head h3{font-size:15px}
.dg-head .dg-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.dg-head .dg-meta span{display:inline-flex;align-items:center;gap:4px}
.dg-head .rt{margin-left:auto;display:flex;gap:6px;align-items:center}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:13px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.18s;display:flex;flex-direction:column;gap:10px}
.scard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--muted))}
.scard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--border-strong)}
.scard-top{display:flex;align-items:flex-start;gap:10px}
.scard-time{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:6px 9px;
  text-align:center;flex:none;line-height:1.2}
.scard-time b{display:block;font-size:13px;font-weight:700;letter-spacing:-.02em}
.scard-time span{font-size:9.5px;color:var(--muted);font-weight:600}
.scard h4{font-size:14px;line-height:1.3;flex:1}
.scard .badge-t{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;flex:none}
.scard-desc{font-size:12px;color:var(--text-soft);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scard-meta{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-soft);
  border-top:1px dashed var(--border);padding-top:10px}
.scard-meta div{display:flex;align-items:center;gap:7px}
.scard-meta div svg{color:var(--muted);flex:none}
.scard-meta div b{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard-tools{position:absolute;top:9px;right:9px;display:flex;gap:3px;opacity:0;transition:.15s}
.scard:hover .scard-tools{opacity:1}
.scard-tools button{background:var(--surface-3);border:1px solid var(--border);color:var(--text-soft);
  border-radius:6px;padding:4px;cursor:pointer;display:flex}
.scard-tools button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ---------- ajanda ---------- */
.agenda{position:relative;padding-left:30px}
.agenda::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.ag-day{position:relative;margin-bottom:22px}
.ag-day::before{content:'';position:absolute;left:-26px;top:7px;width:12px;height:12px;border-radius:99px;
  background:var(--surface);border:3px solid var(--primary)}
.ag-dh{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.ag-dh b{font-size:14px}
.ag-dh span{font-size:12px;color:var(--muted)}
.ag-row{display:flex;gap:14px;padding:9px 12px;border-radius:var(--radius-sm);align-items:flex-start;
  border:1px solid transparent}
.ag-row:hover{background:var(--surface-2);border-color:var(--border)}
.ag-row .t{font-size:12px;font-weight:700;color:var(--text-soft);width:92px;flex:none;padding-top:1px}
.ag-row .c b{font-size:13px;display:block}
.ag-row .c small{font-size:11.5px;color:var(--muted);display:flex;gap:11px;margin-top:2px;flex-wrap:wrap}
.ag-row .c small span{display:inline-flex;align-items:center;gap:4px}

/* ---------- tablo ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{background:var(--surface-2);text-align:left;padding:10px 12px;font-size:11px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:2;white-space:nowrap}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700}
.pill-ok{background:var(--success-soft);color:var(--success)}
.pill-warn{background:var(--warning-soft);color:var(--warning)}
.pill-bad{background:var(--danger-soft);color:var(--danger)}
.pill-info{background:var(--info-soft);color:var(--info)}
.pill-muted{background:var(--surface-3);color:var(--muted)}

/* ---------- panel / kutu ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.panel-h h3{font-size:13.5px;flex:1;display:flex;align-items:center;gap:8px}
.panel-h p{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:400}
.panel-b{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.drop{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:18px;text-align:center;
  background:var(--surface-2);cursor:pointer;transition:.16s}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop svg{width:26px;height:26px;color:var(--muted);margin-bottom:6px;stroke-width:1.5}
.drop b{display:block;font-size:12.5px}
.drop span{font-size:11.5px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.3;stroke-width:1.3;margin-bottom:12px}
.empty b{display:block;font-size:14px;color:var(--text-soft);margin-bottom:5px}
.empty p{margin:0 auto;max-width:400px;font-size:12.5px;line-height:1.7}

/* ============================================================
   MODAL / DRAWER / PALET
   ============================================================ */
.ovl{position:fixed;inset:0;background:rgba(8,15,28,.55);backdrop-filter:blur(3px);display:none;
  align-items:center;justify-content:center;z-index:900;padding:22px}
.ovl.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);width:460px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal-lg{width:860px} .modal-xl{width:1080px} .modal-sm{width:380px}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:15px;flex:1;display:flex;align-items:center;gap:9px}
.modal-h p{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:400}
.modal-b{padding:18px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
.modal-f .lt{margin-right:auto}

.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:880;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1)}
.drawer.on{transform:translateX(0)}
.drawer-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--border);
  background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff}
.drawer-h h3{font-size:14px;flex:1;display:flex;align-items:center;gap:8px}
.drawer-h button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:7px;padding:6px;cursor:pointer;display:flex}
.drawer-h button:hover{background:rgba(255,255,255,.26)}
.drawer-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.drawer-f{padding:11px;border-top:1px solid var(--border);background:var(--surface-2);display:flex;gap:8px;align-items:flex-end}
.drawer-f textarea{min-height:42px;max-height:130px;font-size:12.5px}
.msg{max-width:88%;padding:9px 12px;border-radius:var(--radius);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.a b{color:var(--text)}
.msg-hint{align-self:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.6;padding:8px}

.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:620px;max-width:94vw;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);z-index:950;display:none;overflow:hidden}
.palette.on{display:block}
.pal-in{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--border)}
.pal-in svg{color:var(--accent);flex:none}
.pal-in input{border:none;background:transparent;font-size:15px;padding:0;font-weight:500}
.pal-in input:focus{box-shadow:none}
.pal-in kbd{flex:none}
.pal-body{max-height:44vh;overflow-y:auto;padding:8px}
.pal-sec{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:9px 10px 5px}
.pal-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}
.pal-item:hover,.pal-item.sel{background:var(--primary-soft)}
.pal-item svg{color:var(--muted);flex:none}
.pal-item .t{flex:1}
.pal-item .t b{display:block;font-weight:600}
.pal-item .t span{font-size:11px;color:var(--muted)}
kbd{font-family:var(--font);font-size:10.5px;font-weight:700;background:var(--surface-3);border:1px solid var(--border-strong);
  border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--text-soft)}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:18px;right:18px;z-index:1000;display:flex;flex-direction:column;gap:9px;max-width:370px}
.toast{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:var(--radius);
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:12.5px;
  animation:tin .22s cubic-bezier(.4,0,.2,1);line-height:1.55}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateX(30px);transition:.22s}
.toast svg{flex:none;margin-top:1px}
.toast.ok{border-left:3px solid var(--success)} .toast.ok svg{color:var(--success)}
.toast.err{border-left:3px solid var(--danger)}  .toast.err svg{color:var(--danger)}
.toast.warn{border-left:3px solid var(--warning)}.toast.warn svg{color:var(--warning)}
.toast.info{border-left:3px solid var(--info)}   .toast.info svg{color:var(--info)}

/* ---------- yükleniyor ---------- */
.spin{width:15px;height:15px;border:2px solid var(--border-strong);border-top-color:var(--primary);
  border-radius:99px;animation:sp .7s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ai-busy{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--info-soft);
  border:1px solid var(--border);border-radius:var(--radius);font-size:12.5px;color:var(--text-soft)}
.ai-out{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;font-size:13px;line-height:1.7;white-space:pre-wrap;max-height:400px;overflow-y:auto}
.ai-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 8px;
  border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#3a2b0c;letter-spacing:.03em}

/* ---------- alan editörü ---------- */
.frow{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:7px}
.frow .grip{color:var(--muted);cursor:grab;display:flex}
.frow input[type=text]{flex:1;min-width:70px}
.frow select{width:auto;min-width:104px}
.frow .cbx{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--text-soft);white-space:nowrap}
.frow.dragging{opacity:.4}
.frow.core{background:var(--primary-soft)}

/* ---------- matris ---------- */
.matrix{border-collapse:separate;border-spacing:0;font-size:11px;width:100%}
.matrix th,.matrix td{border:1px solid var(--border);padding:5px 6px;text-align:center;white-space:nowrap}
.matrix th{background:var(--surface-2);font-size:10px;font-weight:700;color:var(--text-soft);position:sticky;top:0;z-index:2}
.matrix .nm{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:650;z-index:3;
  border-right:2px solid var(--border-strong);min-width:170px}
.matrix tr.sel .nm{background:var(--primary-soft)}
.mcell{cursor:pointer;transition:.12s}
.mcell:hover{background:var(--surface-3)}
.mcell.on{background:var(--success-soft);color:var(--success);font-weight:700}
.mcell.on::after{content:'✓'}

/* ---------- yazdırma ---------- */
@media print{
  header,.tabbar,.toolbar,.pool,.scard-tools,.dg-head .rt,.pane-head .rt,#toasts,.drawer{display:none!important}
  body,main,.view,.pane{overflow:visible!important;height:auto!important;display:block!important}
  .doc{box-shadow:none;border:none;max-width:100%}
  .scard{break-inside:avoid;box-shadow:none}
  .daygroup{break-inside:avoid}
}
@media (max-width:1100px){
  .brand-txt{display:none}
  .viewnav button span{display:none}
}
</style>
</head>
