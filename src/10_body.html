<header>
  <div class="brand">
    <img id="brandLogo" src="LOGO_DATA_URI" alt="Kuveyt Türk Akademi">
    <div class="brand-sep"></div>
    <div class="brand-txt"><b>Program Planlayıcı</b><span id="brandSub">Eğitim Takvimi</span></div>
  </div>

  <div class="viewnav" id="viewNav">
    <button data-view="grid" class="on" onclick="setView('grid')"><svg class="ic"><use href="#i-cal"/></svg><span>Takvim</span></button>
    <button data-view="cards" onclick="setView('cards')"><svg class="ic"><use href="#i-grid"/></svg><span>Kartlar</span></button>
    <button data-view="agenda" onclick="setView('agenda')"><svg class="ic"><use href="#i-list"/></svg><span>Ajanda</span></button>
    <button data-view="table" onclick="setView('table')"><svg class="ic"><use href="#i-table"/></svg><span>Tablo</span></button>
    <button data-view="people" onclick="setView('people')"><svg class="ic"><use href="#i-users"/></svg><span>Katılımcılar</span></button>
    <button data-view="setup" onclick="setView('setup')"><svg class="ic"><use href="#i-cog"/></svg><span>Kurulum</span></button>
  </div>

  <div class="hdr-right">
    <button class="hbtn gold" onclick="openPalette()" title="Komut çubuğu (Ctrl+K)">
      <svg class="ic"><use href="#i-spark"/></svg> Yapay Zekâ <kbd style="background:rgba(0,0,0,.14);border-color:rgba(0,0,0,.14);color:inherit">Ctrl K</kbd></button>
    <button class="hbtn" onclick="toggleAssistant()" title="Plan asistanı"><svg class="ic"><use href="#i-msg"/></svg></button>
    <button class="hbtn" onclick="toggleTheme()" title="Tema"><svg class="ic" id="themeIcon"><use href="#i-moon"/></svg></button>
  </div>
</header>

<div class="tabbar" id="tabBar" ondragover="event.preventDefault()" ondrop="dropTab(event)"></div>

<div class="toolbar" id="toolbar">
  <div class="tool-group">
    <span class="lb">Başlangıç</span>
    <input type="date" id="startDate" onchange="onStartDateChange(this.value)">
  </div>
  <button class="btn" onclick="openImport()"><svg class="ic"><use href="#i-up"/></svg> İçe Aktar</button>
  <button class="btn" onclick="openNewSession()"><svg class="ic"><use href="#i-plus"/></svg> Oturum Ekle</button>
  <button class="btn" onclick="openAIPlan()"><svg class="ic"><use href="#i-wand"/></svg> Metinden Program</button>
  <div class="spacer"></div>
  <span class="chip" id="statChip"></span>
  <button class="btn" onclick="openBrief()"><svg class="ic"><use href="#i-chart"/></svg> Özet</button>
  <button class="btn" onclick="openInvite()"><svg class="ic"><use href="#i-mail"/></svg> Davet Metni</button>
  <button class="btn" onclick="exportImage()"><svg class="ic"><use href="#i-img"/></svg> Görsel</button>
  <button class="btn" onclick="exportExcel()"><svg class="ic"><use href="#i-down"/></svg> Excel</button>
  <button class="btn btn-icon" onclick="window.print()" title="Yazdır"><svg class="ic"><use href="#i-print"/></svg></button>
</div>

<main>
  <!-- ================= TAKVİM ================= -->
  <section class="view on" id="view-grid">
    <aside class="pool">
      <div class="pool-head">
        <h3><svg class="ic"><use href="#i-inbox"/></svg> Havuz</h3>
        <span class="chip" id="poolCount">0</span>
        <button class="btn btn-sm" onclick="autoPlace()" title="Havuzdaki oturumları uygun günlere dağıt"><svg class="ic ic-sm"><use href="#i-wand"/></svg> Dağıt</button>
      </div>
      <div class="pool-body" id="poolBody" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropSession(event)"></div>
    </aside>
    <div class="board" id="board"></div>
  </section>

  <!-- ================= KARTLAR ================= -->
  <section class="view" id="view-cards"><div class="pane" id="cardsPane"></div></section>

  <!-- ================= AJANDA ================= -->
  <section class="view" id="view-agenda"><div class="pane" id="agendaPane"></div></section>

  <!-- ================= TABLO ================= -->
  <section class="view" id="view-table"><div class="pane" id="tablePane"></div></section>

  <!-- ================= KATILIMCILAR ================= -->
  <section class="view" id="view-people"><div class="pane" id="peoplePane"></div></section>

  <!-- ================= KURULUM ================= -->
  <section class="view" id="view-setup"><div class="pane" id="setupPane"></div></section>
</main>

<!-- ================= KOMUT PALETİ ================= -->
<div class="ovl" id="palOvl" onclick="closePalette()"></div>
<div class="palette" id="palette">
  <div class="pal-in">
    <svg class="ic ic-lg"><use href="#i-spark"/></svg>
    <input id="palInput" placeholder="Ne yapmak istiyorsun? Örn: salı sabahını boşalt, Ahmet'in derslerini 2. haftaya al" autocomplete="off">
    <kbd>Esc</kbd>
  </div>
  <div class="pal-body" id="palBody"></div>
</div>

<!-- ================= ASİSTAN ================= -->
<aside class="drawer" id="assistant">
  <div class="drawer-h">
    <svg class="ic ic-lg"><use href="#i-msg"/></svg>
    <h3>Plan Asistanı</h3>
    <button onclick="toggleAssistant()"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <div class="drawer-body" id="chatBody"></div>
  <div class="drawer-f">
    <textarea id="chatInput" placeholder="Planla ilgili bir şey sor…" onkeydown="chatKey(event)"></textarea>
    <button class="btn btn-primary btn-icon" onclick="sendChat()"><svg class="ic"><use href="#i-send"/></svg></button>
  </div>
</aside>

<!-- ================= GENEL MODAL ================= -->
<div class="ovl" id="modalOvl" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox">
    <div class="modal-h">
      <svg class="ic ic-lg" id="modalIcon"><use href="#i-edit"/></svg>
      <div style="flex:1"><h3 id="modalTitle">Başlık</h3><p id="modalSub"></p></div>
      <button class="btn btn-ghost btn-icon" onclick="closeModal()"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-b" id="modalBody"></div>
    <div class="modal-f" id="modalFoot"></div>
  </div>
</div>

<div id="toasts"></div>
<input type="file" id="filePick" style="display:none">
